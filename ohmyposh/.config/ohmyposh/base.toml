"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
console_title_template = '{{ .Folder }}'
version = 3
final_space = true

[secondary_prompt]
template = 'λλ '
foreground = 'magenta'
background = 'transparent'

[transient_prompt]
template = '· '
background = 'transparent'
foreground_templates = [
	'{{if gt .Code 0}}red{{end}}',
	'{{if eq .Code 0}}brightblack{{end}}',
]

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
template = '{{ .Path }}'
foreground = 'blue'
background = 'transparent'
type = 'path'
style = 'plain'
[blocks.segments.properties]
style = 'folder'
max_depth = 3

[[blocks.segments]]
# staged (+), unstaged (!), stash (≡), behind (↓), ahead (↑)
template = ' {{ .HEAD }}{{ if .Staging.Changed }} +{{ end }}{{ if .Working.Changed }} !{{ end }}{{ if gt .StashCount 0 }} ≡{{ .StashCount }}{{ end }}{{ if gt .Behind 0 }} ↓{{ end }}{{ if gt .Ahead 0 }} ↑{{ end }}'
foreground = 'gray'
background = 'transparent'
type = 'git'
style = 'plain'
[blocks.segments.properties]
branch_icon = ''
commit_icon = '@'
fetch_status = true
fetch_stash_count = true

[[blocks]]
type = 'rprompt'
overflow = 'hidden'

[[blocks.segments]]
template = '{{ if gt .Code 0 }}✘ {{ .Code }} {{ end }}'
foreground = 'red'
background = 'transparent'
type = 'text'
style = 'plain'

[[blocks.segments]]
template = '{{ if .Env.LF_LEVEL }}lf{{ .Env.LF_LEVEL }} {{ end }}'
foreground = 'cyan'
background = 'transparent'
type = 'text'
style = 'plain'

[[blocks.segments]]
# Only shown while a virtual environment is active
template = '{{ if .Venv }}{{ .Venv }} {{ end }}'
foreground = 'green'
background = 'transparent'
type = 'python'
style = 'plain'
[blocks.segments.properties]
fetch_version = false
fetch_virtual_env = true
display_mode = 'environment'

[[blocks.segments]]
template = '{{ .FormattedMs }}'
foreground = 'yellow'
background = 'transparent'
type = 'executiontime'
style = 'plain'
[blocks.segments.properties]
threshold = 1000
style = 'austin'

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
template = 'λ'
background = 'transparent'
type = 'text'
style = 'plain'
foreground_templates = [
	'{{if gt .Code 0}}red{{end}}',
	'{{if eq .Code 0}}magenta{{end}}',
]
