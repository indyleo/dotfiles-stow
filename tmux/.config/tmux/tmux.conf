set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g mouse on

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Unbind old split keys
unbind '"'
unbind %

# ── Master / stack auto-tiling ──────────────────────────────────────────
bind Enter run-shell -b '~/.config/tmux/tile.sh new'
bind m     run-shell -b '~/.config/tmux/tile.sh swap'
bind Tab   run-shell -b '~/.config/tmux/tile.sh focus'

set-hook -g after-kill-pane 'run-shell -b "sleep 0.05; ~/.config/tmux/tile.sh rebalance"'
set-hook -g pane-exited     'run-shell -b "sleep 0.05; ~/.config/tmux/tile.sh rebalance"'

# Kill/close pane
bind q kill-pane

# Default Shell
set-option -g default-shell /bin/zsh

# Theme
set-option -g status-position top
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
