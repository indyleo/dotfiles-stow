# ~/.config/life-wallpaper/config.toml  -  reload with: pkill -HUP life-wallpaper
# CLI flags override this file. Flat `key = value` only.

cell_size = 8         # logical px; >= 8 recommended for rain/overlay glyphs
fps = 8               # generations per second
density = 0.25        # soup density at start (also used for reseeds unless reseed_density is set)
reseed_density = 0.30

rule = "life" # life | highlife | daynight | seeds | brain | rotate | "B36/S23"
color = "age" # age = yellow -> green -> orange -> red by cell age, or a single colour:
# green yellow orange red aqua blue purple "#rrggbb"

trail = true       # fading afterglow on dead cells
trail_length = 8   # generations
rain = false       # faint hex code-rain behind the cells
rain_density = 1.0
overlay = true     # bottom-left "gen N pop N rule hz" status line
sysload = false    # CPU load -> speed, sparks and warmer colours
patterns = true    # LWSS / pulsar / Gosper gun injections
stamps = true      # Tux / Arch logo / terminal text stamps

# Staleness: the board is never wiped just because time passed. When it goes calm
# (little still moving, or the whole board repeating) for stagnation_secs, new life
# (soup patches in the emptiest areas, plus gliders) is added on top of what is there.
stagnation_secs = 60 # how long the board must stay calm before new life is added
calm_pct = 0.3       # calm = moving/chaotic cells below this % of the grid (0 = only a fully repeating board)
# When still lifes and oscillators clog the grid, some of them are pruned (whole shapes,
# fading out over a few generations) - the board is not wiped.
clutter_pct = 8     # prune when settled shapes cover this % of the grid (0 = never prune)
soft_reset_secs = 0 # optional timed full reset; 0 = never

# Smoothness: cells crossfade between generations (births fade in, deaths fade out).
smooth = true
render_fps = 30     # frames per second while crossfading (idle boards draw nothing)
pause_hidden = true # stop simulating/drawing while a fullscreen window or lock screen covers it

# Look of each cell
cell_gap = 1          # empty px between cells (logical px, 0-8); 0 = solid blocks
cell_shape = "square" # square | circle | hex | rounded (old key cell_round: true = rounded, false = square)

# Colour by age: "steps" = four flat classes, "smooth" = a continuous gradient through the same colours
color_mode = "steps"
color_smooth_stops = "newborn,mature,old,ancient" # smooth only: the palette entries the gradient runs through (at least two)

# Keep the board across restarts (saved to ~/.local/state/life-wallpaper/<output>.board)
persist = true
save_secs = 300 # also save every N seconds in case of a crash (0 = only on exit)

glider_min_secs = 60
glider_max_secs = 90
special_min_secs = 90
special_max_secs = 180
stamp_min_secs = 150
stamp_max_secs = 300

# Palette (Gruvbox defaults)
bg = "#282828"
newborn = "#fabd2f"
mature = "#b8bb26"
old = "#fe8019"
ancient = "#fb4934"
dying = "#458588"         # Brian's Brain dying cells
rain_color = "#689d6a"
overlay_color = "#a89984"

# ---- Liveliness: keep things happening without ever wiping the board ----
local_calm_secs = 12       # a tile of the board with nothing moving for this long gets new life (0 = off)
tile_size = 16             # tile edge in cells
decay_after = 120          # cells stuck in a still life / oscillator may die after this many generations (0 = off)
decay_chance = 0.03        # per-generation chance for such a cell
noise_per_sec = 1.5        # random single-cell disturbances ("cosmic rays") per second
rule_shift_secs = 45       # every ~N seconds swap to a livelier rule for a moment (0 = off); Life/HighLife boards only
rule_shift_gens = 10       # how many generations each swap lasts (per tile in ripple mode)
rule_shift_mode = "ripple" # "ripple": tiles switch ring by ring from a random tile; "global": whole board at once
rule_shift_stagger = 3     # ripple: generations between one ring of tiles and the next
fastforward = true         # run extra generations per tick while the whole board is calm
fastforward_speed = 4
colonies = true            # births inherit the majority colour of their parents (needs color = "age")
colony_mutation = 0.01     # chance a birth picks a random colony
# colony_colors = "yellow,green,orange,red,aqua,blue,purple"   # 2 to 8 colours
traffic = true         # convoys of LWSS / MWSS / HWSS crossing the board
traffic_min_secs = 100
traffic_max_secs = 200
gun_secs = 60          # Gosper guns are taken down after this long (0 = forever)
symmetry_chance = 0.25 # chance an injected soup is mirror / rotation symmetric
hypr_events = true     # Hyprland: workspace switch = gliders, window open / close = a patch of life
hypr_locate = true     # ask Hyprland where the window is: bloom where a closed one was, halo around a new one
clock_stamp_secs = 600 # every ~N seconds a stamp spells the time, HH:MM (0 = off; needs stamps = true)

# ---- Audio (off by default; pw-cat, falling back to parec / pacat; audio, audio_command and the sensitivities are read at start-up) ----
audio = true            # react to whatever is playing
audio_sensitivity = 1.0 # 0.2 to 5, higher reacts to softer beats (the master for the bands below)
audio_gliders = true    # a beat sends a glider (needs audio)
audio_react = true      # the board lights up with the music; no cells are added (needs audio)
audio_gain = 2.0        # how loud the signal is taken to be before it drives the light
audio_brighten = 0.35   # live cells lift towards white at full mid level
audio_glow = 0.35       # extra halo at full bass level
audio_bg = 0.08         # faint background pulse at full treble level
audio_flash = 0.5       # strength of the short flash on each beat
audio_flash_ms = 150    # how long that flash lasts
audio_attack_ms = 30    # light rises this fast ...
audio_release_ms = 300  # ... and falls this slowly (frame-rate independent)
audio_floor = 0.02      # levels below this light nothing
# Per-band beat sensitivity ("master" = follow audio_sensitivity), and what a band's beats do:
audio_band_bass_sensitivity = "master"
audio_band_mid_sensitivity = "master"
audio_band_treble_sensitivity = "master"
audio_band_bass_gliders = false          # gliders follow the bass band instead of the full-range detector
audio_band_mid_sparks = false            # mid-band beats drop sparks (now and then a methuselah)
audio_band_treble_noise = false          # treble beats add cosmic rays
audio_restart_backoff = true             # restart the helper if it exits (0.5 s, 1 s, 2 s ... up to audio_restart_max_secs)
audio_restart_max_secs = 30
# audio_command = "pw-cat --record --format s16 --rate 11025 --channels 1 -P {stream.capture.sink=true} -"

# ---- Look ----
breathe = 0.3        # generation rate swells and ebbs by +-30% (0 = off)
breathe_secs = 90
glow = 0.25          # soft halo around live cells (0 = off)
vignette = 0.2       # dim towards the screen edges (0 = off)
hue_drift = 0        # palette hue wanders +-N degrees (0 = off)
hue_drift_secs = 900
night_dim = 0        # fraction of brightness removed at night, e.g. 0.35 (0 = off)
night_start = 22     # local hour
night_end = 7

# ---- Control socket (off by default): script the wallpaper with life-wallpaper-ctl ----
ipc = false
# ipc_path = ""          # default: $XDG_RUNTIME_DIR/life-wallpaper-<output|all>.sock

# ---- Battery (off by default): calmer and dimmer when running on a low battery ----
power = false
battery_threshold = 40                                 # percent: low-power mode at or below this charge, on battery
battery_dim = 0.15                                     # extra brightness removed (stacks with night_dim)
battery_fps_scale = 0.5                                # multiply fps by this
battery_disable = "traffic,guns,stamps,audio,patterns"

# ---- Idle (off by default; Hyprland only): calmer after a while without pointer or window activity ----
idle = false
idle_secs = 300
idle_fps_scale = 0.5
idle_fastforward = true # calm boards fast-forward while idle
idle_dim = 0.2
idle_breathe = 0.6      # breathe depth while idle (if larger than breathe)

# ---- Media player (off by default; needs playerctl) ----
mpris = true
# mpris_player = ""      # default: whichever player is active
mpris_artist_colors = true # a new track blooms in a colour chosen by the artist (needs colonies)

# ---- Diagnostics and scenes ----
stats = false   # one status line per second on stderr
verbose = false # audio levels, IPC commands, track changes
# scenes_dir = ""  # default: ~/.local/state/life-wallpaper/scenes

# Rules a rule shift may swap in (comma separated):
# rule_shift_rules = "b34/s23,b3/s234,b3/s2345"

# ---- Board topology and extras ----
grid = "square"               # square | hex | von-neumann (hex is drawn with odd rows shifted; an even row count is used)
overlay_sparkline = false     # population / settled sparkline above the overlay text (needs overlay)
workspace_ripple = false      # a workspace switch sends a quick ripple of the alternative rule across the board
audio_band_bass_bloom = false # sustained loud bass blooms a pulsar (needs audio)

# ---- Pointer (off by default; Hyprland): leave cells where the mouse goes ----
cursor = false
cursor_mode = "trail"    # trail | sparkle | soup
cursor_radius = 2
cursor_interval_ms = 100

# ---- Command: stdout lines of a command are events ----
# Each line is a JSON object like {"inject":"glider","edge":"left"} or {"text":"hello"} / {"set":"glow","value":0.5},
# or the control socket's own syntax (inject glider --edge left).
command = ""
command_interval_secs = 0 # 0 = a long-running process; N = run it every N seconds

# ---- Weather (off by default): wttr.in-style JSON tints the palette and adds rain / snow ----
weather = true
weather_command = "curl -s -m 10 wttr.in/?format=j1"
weather_interval_secs = 900
weather_palette = true
