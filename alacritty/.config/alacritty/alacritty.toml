[colors]
draw_bold_text_with_bright_colors = true

[general]
import = ["~/.config/alacritty/colours.toml"]

[env]
TERM = "xterm-256color"

[font]
size = 12.0

[font.bold]
family = "CaskaydiaCove NF"
style = "Bold"

[font.bold_italic]
family = "CaskaydiaCove NF"
style = "Bold Italic"

[font.italic]
family = "CaskaydiaCove NF"
style = "Italic"

[font.normal]
family = "CaskaydiaCove NF"
style = "Regular"

[font.offset]
x = 0
y = 1

[scrolling]
history = 5000

[terminal]
shell = "zsh"

[window]
dynamic_padding = false
opacity = 0.85
title = "Alacritty"
decorations = "none"
startup_mode = "Maximized"
dynamic_title = true

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 6
y = 6

# =============================================================================
# KEYBINDS
# =============================================================================

[keyboard]
bindings = [
	# --- Clipboard ---
	{ key = "V", mods = "Control|Shift", action = "Paste" },
	{ key = "C", mods = "Control|Shift", action = "Copy" },
	{ key = "Insert", mods = "Shift", action = "PasteSelection" },

	# --- Font size ---
	{ key = "Key0", mods = "Control", action = "ResetFontSize" },
	{ key = "Equals", mods = "Control", action = "IncreaseFontSize" },
	{ key = "Plus", mods = "Control", action = "IncreaseFontSize" },
	{ key = "Minus", mods = "Control", action = "DecreaseFontSize" },

	# --- Window ---
	{ key = "F11", mods = "None", action = "ToggleFullscreen" },
	{ key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },

	# --- Scrollback ---
	{ key = "PageUp", mods = "None", mode = "~Alt", action = "ScrollPageUp" },
	{ key = "PageDown", mods = "None", mode = "~Alt", action = "ScrollPageDown" },
	{ key = "Home", mods = "Shift", mode = "~Alt", action = "ScrollToTop" },
	{ key = "End", mods = "Shift", mode = "~Alt", action = "ScrollToBottom" },

	# --- Ctrl+L ---
	{ key = "L", mods = "Control", action = "ClearLogNotice" },
	{ key = "L", mods = "Control", chars = "\f" },

	# --- Vi mode ---
	{ key = "Escape", mods = "Control", action = "ToggleViMode" },

	# --- Shift+Enter as literal CR ---
	{ key = "Return", mods = "Shift", chars = "\u001B\r" },
]

# =============================================================================
# HINTS
# =============================================================================
# The `binding` field inside each hint is what activates it. You do NOT need
# a matching entry in [keyboard].bindings — Alacritty registers these itself.

[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file://|ssh://|git://|/)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
command = "xdg-open"
post_processing = true
mouse = { enabled = true }
binding = { key = "O", mods = "Control|Shift" }
hyperlinks = true

[[hints.enabled]]
regex = "(?:[\\w.\\-]+/)*[\\w.\\-]+\\.[A-Za-z0-9_]+(?::\\d+){1,2}"
command = { program = "nvim", args = ["+{2}", "+normal! {3}G", "{1}"] }
post_processing = true
mouse = { enabled = true }
binding = { key = "E", mods = "Control|Shift" }

[[hints.enabled]]
regex = "(?:[\\w.\\-]+/)+[\\w.\\-]+\\.[A-Za-z0-9_]+"
command = { program = "nvim", args = ["{0}"] }
post_processing = false
mouse = { enabled = true }
binding = { key = "F", mods = "Control|Shift" }

[[hints.enabled]]
regex = "(?:[\\w.\\-]+/)+[\\w.\\-]+/"
command = { program = "lf", args = ["-last-dir-path=/tmp/lf-hint", "{0}"] }
post_processing = false
mouse = { enabled = true }
binding = { key = "D", mods = "Control|Shift" }

[[hints.enabled]]
regex = "\\b[0-9a-f]{7,40}\\b"
command = { program = "sh", args = ["-c", "git show {0} | moor"] }
post_processing = true
mouse = { enabled = false }
binding = { key = "G", mods = "Control|Shift" }
